# Final domain knowledge check across all four sections, including module 02 of each.
schema_version: 1
kind: question_bank
id: ats102-final
course_id: ATS102
exam_code: HARBOR
status: draft
provenance: Original practice material written for this course; not official exam
  questions.
scope:
  type: domain
  id: content-trust-vulnerability-scanning-sboms
  title: Content Trust, Vulnerability Scanning & SBOMs
questions:
- id: ats102-final-q01
  type: single_choice
  difficulty: intermediate
  learning_objective: Diagnose a failed scan
  source_readings:
  - sections/section-010/module-01/course-01-how-harbor-scans-with-trivy.md
  prompt: A scan request returns at once, but the scan later ends in an error. The
    `harbor-trivy` pod is not running. What is the most likely reason?
  options:
  - id: a
    text: "`core` refused the request because the user has no permission."
    explanation: Not correct. A permission error would answer the request itself,
      not end the scan later.
  - id: b
    text: The Trivy database is older than 12 hours.
    explanation: Not correct. An old database makes the adapter download a newer one.
      It does not stop the scan.
  - id: c
    text: The job started but the Trivy adapter was not there to run it.
    explanation: Correct. A scan is a background job, so the request succeeds and
      the job cannot finish without the adapter.
  - id: d
    text: The project has scan on push turned off.
    explanation: Not correct. That setting only decides whether new pushes start scans.
  correct_option: c
  explanation: Correct. A scan is a background job, so the request succeeds and the
    job cannot finish without the adapter.
- id: ats102-final-q02
  type: single_choice
  difficulty: beginner
  learning_objective: Start a scan and read its state
  source_readings:
  - sections/section-010/module-01/course-02-scanning-and-reading-a-report.md
  prompt: What does `harbor artifact scan start inventory/podinfo/6.0.0` do?
  options:
  - id: a
    text: It starts the scan job and returns at once without waiting for the result.
    explanation: Correct. The result appears later in the scan overview.
  - id: b
    text: It waits until the scan is done and prints the report.
    explanation: Not correct. The command only starts the job.
  - id: c
    text: It scans every artifact in the project `inventory`.
    explanation: Not correct. It names one artifact, so it scans only that one.
  - id: d
    text: It turns on scan on push for the project.
    explanation: Not correct. That is the project setting `auto_scan`.
  correct_option: a
  explanation: Correct. The result appears later in the scan overview.
- id: ats102-final-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: Know the limit of scan on push
  source_readings:
  - sections/section-010/module-01/course-03-scan-on-push-and-scheduled-scans.md
  prompt: Scan on push is now on for `inventory`, which holds an older, never scanned
    artifact. What happens to the old artifact?
  options:
  - id: a
    text: Harbor scans it within a minute.
    explanation: Not correct. Turning the setting on does not trigger scans of existing
      artifacts.
  - id: b
    text: Harbor deletes it.
    explanation: Not correct. Harbor never deletes artifacts because of a scan setting.
  - id: c
    text: Harbor refuses to serve it.
    explanation: Not correct. Refusing pulls needs `prevent_vul`, not scan on push.
  - id: d
    text: Nothing. It stays unscanned until someone scans it or scan all runs.
    explanation: Correct. Scan on push only acts on new pushes.
  correct_option: d
  explanation: Correct. Scan on push only acts on new pushes.
- id: ats102-final-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: Tell an SBOM from a vulnerability report
  source_readings:
  - sections/section-020/module-01/course-01-what-an-sbom-is.md
  prompt: Which statement about an SBOM and a vulnerability report is correct?
  options:
  - id: a
    text: The SBOM changes every 12 hours with the Trivy database.
    explanation: Not correct. The SBOM only lists packages and does not use the database.
  - id: b
    text: The SBOM of an image never changes after the build, but its vulnerability
      report can.
    explanation: Correct. The packages are fixed, while the vulnerability database
      keeps learning.
  - id: c
    text: The vulnerability report lists packages without versions.
    explanation: Not correct. A report names the package version and the fixed version.
  - id: d
    text: Both always have the same content.
    explanation: Not correct. One lists packages and the other lists vulnerabilities.
  correct_option: b
  explanation: Correct. The packages are fixed, while the vulnerability database keeps
    learning.
- id: ats102-final-q05
  type: single_choice
  difficulty: intermediate
  learning_objective: Predict what happens when an image is deleted
  source_readings:
  - sections/section-020/module-01/course-01-what-an-sbom-is.md
  prompt: What happens to the SBOM accessory when you delete its subject image?
  options:
  - id: a
    text: It stays in the repository forever.
    explanation: Not correct. An accessory belongs to its subject.
  - id: b
    text: It moves to the project `library`.
    explanation: Not correct. Harbor does not move accessories.
  - id: c
    text: It becomes a vulnerability report.
    explanation: Not correct. An SBOM never becomes a report.
  - id: d
    text: Harbor deletes the accessory together with the image.
    explanation: Correct. Accessories are deleted with their subject.
  correct_option: d
  explanation: Correct. Accessories are deleted with their subject.
- id: ats102-final-q06
  type: single_choice
  difficulty: beginner
  learning_objective: Turn on SBOM generation on push
  source_readings:
  - sections/section-020/module-01/course-02-generating-and-reading-an-sbom.md
  prompt: Which project metadata key makes Harbor generate an SBOM for every pushed
    artifact?
  options:
  - id: a
    text: "`auto_scan`"
    explanation: Not correct. That key starts vulnerability scans.
  - id: b
    text: "`auto_sbom_generation`"
    explanation: Correct. Set it to `"true"` with a `PUT` of the project metadata.
  - id: c
    text: "`enable_content_trust_cosign`"
    explanation: Not correct. That key enforces Cosign signatures.
  - id: d
    text: "`prevent_vul`"
    explanation: Not correct. That key refuses vulnerable pulls.
  correct_option: b
  explanation: Correct. Set it to `"true"` with a `PUT` of the project metadata.
- id: ats102-final-q07
  type: single_choice
  difficulty: beginner
  learning_objective: Know where Notary went
  source_readings:
  - sections/section-030/module-01/course-01-signatures-and-accessories.md
  prompt: In which Harbor version did Notary support end?
  options:
  - id: a
    text: Notary was removed completely in version 2.9.0.
    explanation: Correct. It was deprecated in 2.6.0 and removed in 2.9.0.
  - id: b
    text: Harbor 2.15 still ships Notary as an option.
    explanation: Not correct. Harbor 2.15 has no Notary server.
  - id: c
    text: Notary was removed in Harbor 1.0.
    explanation: Not correct. Harbor shipped Notary in versions 1 and early 2.
  - id: d
    text: Notary was never part of Harbor.
    explanation: Not correct. Older Harbor versions had it.
  correct_option: a
  explanation: Correct. It was deprecated in 2.6.0 and removed in 2.9.0.
- id: ats102-final-q08
  type: single_choice
  difficulty: beginner
  learning_objective: Choose the signing keys
  source_readings:
  - sections/section-030/module-01/course-02-signing-with-cosign.md
  prompt: Which two files does `cosign generate-key-pair` create?
  options:
  - id: a
    text: "`cosign.crt` and `cosign.json`."
    explanation: Not correct. Those are not the created files.
  - id: b
    text: "`cosign.pub` for signing and `cosign.key` for verifying."
    explanation: Not correct. The roles are the other way round.
  - id: c
    text: "`cosign.key`, the private key that signs, and `cosign.pub`, the public
      key that verifies."
    explanation: Correct. The private key is encrypted with the password.
  - id: d
    text: A single file named `cosign.pem`.
    explanation: Not correct. Cosign writes two files.
  correct_option: c
  explanation: Correct. The private key is encrypted with the password.
- id: ats102-final-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: Read the refusal
  source_readings:
  - sections/section-030/module-01/course-03-enforcing-signatures.md
  prompt: What does Harbor answer when a pull is refused because the artifact is unsigned?
  options:
  - id: a
    text: HTTP `401 Unauthorized`.
    explanation: Not correct. That status means the sign-in failed.
  - id: b
    text: HTTP `412 Precondition Failed`, code `PROJECTPOLICYVIOLATION`, message `The
      image is not signed by cosign.`
    explanation: Correct. Every client reports this status in its own words.
  - id: c
    text: HTTP `404 Not Found`.
    explanation: Not correct. The artifact exists.
  - id: d
    text: HTTP `500 Internal Server Error`.
    explanation: Not correct. A policy refusal is not a server error.
  correct_option: b
  explanation: Correct. Every client reports this status in its own words.
- id: ats102-final-q10
  type: single_choice
  difficulty: intermediate
  learning_objective: Read the threshold
  source_readings:
  - sections/section-040/module-01/course-01-preventing-vulnerable-images.md
  prompt: The project has `severity` set to `high`. Which artifact is refused?
  options:
  - id: a
    text: One whose worst finding is only Critical.
    explanation: Not correct. A High finding also blocks.
  - id: b
    text: One whose worst finding is Medium.
    explanation: Not correct. Medium is below `high`.
  - id: c
    text: One whose worst finding is High or Critical.
    explanation: Correct. The rule is at or above the threshold.
  - id: d
    text: One with no findings.
    explanation: Not correct. A clean artifact is served.
  correct_option: c
  explanation: Correct. The rule is at or above the threshold.
- id: ats102-final-q11
  type: single_choice
  difficulty: intermediate
  learning_objective: Know the exempt pulls
  source_readings:
  - sections/section-040/module-01/course-01-preventing-vulnerable-images.md
  prompt: Which pulls are exempt from the vulnerability policy?
  options:
  - id: a
    text: Pulls by Harbor's own scanner, and by Cosign or Notation clients that sign.
    explanation: Correct. The scanner must read vulnerable artifacts to scan them.
  - id: b
    text: Pulls by the system administrator.
    explanation: Not correct. The policy refuses `admin` too.
  - id: c
    text: Pulls over HTTPS.
    explanation: Not correct. The transport does not matter.
  - id: d
    text: Pulls by tag.
    explanation: Not correct. Tag pulls are checked.
  correct_option: a
  explanation: Correct. The scanner must read vulnerable artifacts to scan them.
- id: ats102-final-q12
  type: single_choice
  difficulty: advanced
  learning_objective: Write the narrow exception
  source_readings:
  - sections/section-040/module-01/course-02-cve-allowlists.md
  prompt: What makes an exception for one reviewed image narrow and safe?
  options:
  - id: a
    text: It is added to the system allowlist without an expiry.
    explanation: Not correct. That affects every project that reuses the system list.
  - id: b
    text: It lowers `severity` to `critical`.
    explanation: Not correct. That lets every High finding of the project through.
  - id: c
    text: It turns off `prevent_vul` for the project.
    explanation: Not correct. That removes the protection for all images.
  - id: d
    text: It lives in one project, lists only the reviewed CVEs, and has an expiry.
    explanation: Correct. Each property limits the damage if it is forgotten.
  correct_option: d
  explanation: Correct. Each property limits the damage if it is forgotten.
- id: ats102-final-q13
  type: single_choice
  difficulty: intermediate
  learning_objective: Change Trivy adapter settings
  source_readings:
  - sections/section-010/module-02/course-02-configuring-the-trivy-adapter.md
  prompt: How do you make the built-in Trivy adapter ignore vulnerabilities that have
    no fixed version?
  options:
  - id: a
    text: Add a CVE allowlist entry for every unfixed finding.
    explanation: Not correct. An allowlist is a per-CVE decision for pulls, not a
      report setting for the scanner.
  - id: b
    text: Turn on scan on push for the project.
    explanation: Not correct. Scan on push controls when scans start, not what they
      report.
  - id: c
    text: Set `SCANNER_TRIVY_IGNORE_UNFIXED=true` on the `harbor-trivy` StatefulSet.
    explanation: Correct. The adapter reads its behaviour from `SCANNER_TRIVY_*` variables.
  - id: d
    text: Lower the severity filter in the project settings.
    explanation: Not correct. The project severity setting controls pull prevention,
      not the report content.
  correct_option: c
  explanation: Correct. The adapter reads its behaviour from `SCANNER_TRIVY_*` variables.
- id: ats102-final-q14
  type: single_choice
  difficulty: advanced
  learning_objective: Stop a scan
  source_readings:
  - sections/section-010/module-02/course-04-scan-states-and-logs.md
  prompt: What is the scan state after you stop a running scan with the API?
  options:
  - id: a
    text: "`Error`"
    explanation: Not correct. `Error` is for a failed scan, not a stopped one.
  - id: b
    text: "`Stopped`"
    explanation: Correct. Stopping a scan ends it with the state `Stopped`.
  - id: c
    text: "`Success`"
    explanation: Not correct. `Success` means a complete report.
  - id: d
    text: "`None`"
    explanation: Not correct. `None` is the state of an artifact that was never scanned.
  correct_option: b
  explanation: Correct. Stopping a scan ends it with the state `Stopped`.
- id: ats102-final-q15
  type: single_choice
  difficulty: intermediate
  learning_objective: Read dataLicense correctly
  source_readings:
  - sections/section-020/module-02/course-01-structure-of-an-spdx-document.md
  prompt: What does the `dataLicense` field of an SPDX document state?
  options:
  - id: a
    text: The license of the scanned image.
    explanation: Not correct. The licenses of the software are in the package entries.
  - id: b
    text: The license of the most common package.
    explanation: Not correct. There is no field that summarises the packages.
  - id: c
    text: The license of the SBOM file itself.
    explanation: Correct. `dataLicense` covers the document and not the software it
      lists.
  - id: d
    text: The license of the scanner.
    explanation: Not correct. The scanner's license is not recorded here.
  correct_option: c
  explanation: Correct. `dataLicense` covers the document and not the software it
    lists.
- id: ats102-final-q16
  type: single_choice
  difficulty: advanced
  learning_objective: Check that an SBOM matches the image
  source_readings:
  - sections/section-020/module-02/course-04-the-life-of-an-sbom-accessory.md
  prompt: How do you check that an SBOM describes the image a tag points at now?
  options:
  - id: a
    text: Compare the creation time of the SBOM with the push time.
    explanation: Not correct. Times can be close and still describe different images.
  - id: b
    text: Compare the digest of the tag with `subject_artifact_digest` of the accessory.
    explanation: Correct. The accessory records the digest it describes.
  - id: c
    text: Compare the size of the SBOM with the image.
    explanation: Not correct. Sizes say nothing about the subject.
  - id: d
    text: Read the `name` field of the document.
    explanation: Not correct. The name does not identify a digest.
  correct_option: b
  explanation: Correct. The accessory records the digest it describes.
- id: ats102-final-q17
  type: single_choice
  difficulty: beginner
  learning_objective: Add an annotation
  source_readings:
  - sections/section-030/module-02/course-02-annotations-and-more-than-one-signer.md
  prompt: Which `cosign sign` flag adds the annotation `approved-by=security`?
  options:
  - id: a
    text: "`--label approved-by=security`"
    explanation: Not correct. `--label` is not a Cosign signing flag.
  - id: b
    text: "`--tag approved-by=security`"
    explanation: Not correct. `--tag` is not a Cosign signing flag.
  - id: c
    text: "`-a approved-by=security`"
    explanation: Correct. `-a key=value` adds an annotation to the signed payload.
  - id: d
    text: "`--note approved-by=security`"
    explanation: Not correct. `--note` is not a Cosign signing flag.
  correct_option: c
  explanation: Correct. `-a key=value` adds an annotation to the signed payload.
- id: ats102-final-q18
  type: single_choice
  difficulty: intermediate
  learning_objective: Describe keyless signing
  source_readings:
  - sections/section-030/module-02/course-04-keys-keyless-and-rotation.md
  prompt: What does keyless signing use instead of a long-lived private key?
  options:
  - id: a
    text: A key stored in Harbor.
    explanation: Not correct. Harbor does not hold signing keys.
  - id: b
    text: A short-lived certificate tied to an identity, with the signature recorded
      in a public log.
    explanation: Correct. Fulcio issues the certificate and Rekor records the signature.
  - id: c
    text: A shared password.
    explanation: Not correct. A password is not an identity proof.
  - id: d
    text: The robot account secret.
    explanation: Not correct. Robot secrets are for registry access.
  correct_option: b
  explanation: Correct. Fulcio issues the certificate and Rekor records the signature.
- id: ats102-final-q19
  type: single_choice
  difficulty: intermediate
  learning_objective: Handle the robot secret
  source_readings:
  - sections/section-040/module-02/course-01-robot-accounts.md
  prompt: A pipeline lost the secret of its robot. What is the right fix?
  options:
  - id: a
    text: Read the secret from the robot listing.
    explanation: Not correct. The listing never shows the secret.
  - id: b
    text: Ask Harbor to show the secret again.
    explanation: Not correct. Harbor cannot show it again.
  - id: c
    text: Refresh the secret of the robot and store the new one.
    explanation: Correct. Harbor shows the secret once, so you replace it.
  - id: d
    text: Use the administrator password.
    explanation: Not correct. That gives the pipeline more rights than it needs.
  correct_option: c
  explanation: Correct. Harbor shows the secret once, so you replace it.
- id: ats102-final-q20
  type: single_choice
  difficulty: advanced
  learning_objective: Write a safe gate
  source_readings:
  - sections/section-040/module-02/course-04-a-pipeline-gate.md
  prompt: A gate script cannot reach Harbor. What should it do?
  options:
  - id: a
    text: Print a warning and exit `0`.
    explanation: Not correct. That passes everything during an outage.
  - id: b
    text: Exit with a failure, so the pipeline stops.
    explanation: Correct. A gate must fail closed when it cannot decide.
  - id: c
    text: Retry forever.
    explanation: Not correct. A pipeline that never ends blocks the team.
  - id: d
    text: Pass if the last run passed.
    explanation: Not correct. An old result says nothing about the current artifact.
  correct_option: b
  explanation: Correct. A gate must fail closed when it cannot decide.
