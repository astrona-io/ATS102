# Scan Every Pushed Artifact
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-102-lab-010-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-harbor"
      description: "Installs Helm, Harbor 2.15.4 and the workstation pod"
      type: "file"
      source: "bootstrap/01-install-harbor.sh"
    - name: "ats-102-lab-010-01-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-harbor"
      description: "Waits until every Harbor component reports healthy"
      type: "file"
      source: "testing/wait-for-harbor.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-scan-on-push"
      description: "The project inventory scans every pushed artifact"
      type: "file"
      source: "validation/validate-scan-on-push.sh"
    - name: "validate-scan-all-daily"
      description: "Harbor scans all artifacts every day"
      type: "file"
      source: "validation/validate-scan-all-daily.sh"
    - name: "validate-pushed-release-scanned-on-push"
      description: "podinfo 6.14.1 was pushed and scanned on push"
      type: "file"
      source: "validation/validate-pushed-release-scanned-on-push.sh"
    - name: "validate-every-artifact-scanned"
      description: "Every artifact in inventory/podinfo has a successful scan"
      type: "file"
      source: "validation/validate-every-artifact-scanned.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - alpine:3.22
      - docker.io/goharbor/harbor-core:v2.15.4
      - docker.io/goharbor/harbor-db:v2.15.4
      - docker.io/goharbor/harbor-jobservice:v2.15.4
      - docker.io/goharbor/harbor-portal:v2.15.4
      - docker.io/goharbor/harbor-registryctl:v2.15.4
      - docker.io/goharbor/nginx-photon:v2.15.4
      - docker.io/goharbor/registry-photon:v2.15.4
      - docker.io/goharbor/trivy-adapter-photon:v2.15.4
      - docker.io/valkey/valkey:8.1.10-alpine
