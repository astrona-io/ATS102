# Knowledge check for module 02 of section 010. Listed in astrona.yaml as a `type: quiz` entry after the module summary.
schema_version: 1
kind: question_bank
id: ats102-010-m02
course_id: ATS102
exam_code: HARBOR
status: draft
provenance: Original practice material written for this course; not official exam
  questions.
scope:
  type: module
  id: section-010-module-02
  title: Configure Trivy And Read Findings In Depth
placement:
  position: after
  reading: sections/section-010/module-02/course-05-summary.md
questions:
- id: ats102-010-m02-q01
  type: single_choice
  difficulty: beginner
  learning_objective: Say what a scanner registration holds
  source_readings:
  - sections/section-010/module-02/course-01-scanner-registrations.md
  prompt: What does a scanner registration in Harbor hold?
  options:
  - id: a
    text: The name and URL of a scanner adapter, and how Harbor reaches it.
    explanation: Correct. A registration is the address and settings of an adapter
      that Harbor calls.
  - id: b
    text: The vulnerability database that the scanner downloads.
    explanation: Not correct. The database belongs to the adapter, not to the registration.
  - id: c
    text: The list of artifacts that the scanner has already scanned.
    explanation: Not correct. Reports are stored with the artifact, not in the registration.
  - id: d
    text: The robot account that the scanner uses to pull layers.
    explanation: Not correct. The adapter gets pull access from Harbor for each scan
      job.
  correct_option: a
  explanation: Correct. A registration is the address and settings of an adapter that
    Harbor calls.
- id: ats102-010-m02-q02
  type: single_choice
  difficulty: intermediate
  learning_objective: Change the scanner of one project
  source_readings:
  - sections/section-010/module-02/course-01-scanner-registrations.md
  prompt: Which change makes one project use a different registered scanner and leaves
    the other projects alone?
  options:
  - id: a
    text: Make the other scanner the system default.
    explanation: Not correct. Changing the default affects every project that has
      no own setting.
  - id: b
    text: Set the scanner on that project with the project scanner setting.
    explanation: Correct. The project scanner setting overrides the default for that
      project only.
  - id: c
    text: Delete the first scanner registration.
    explanation: Not correct. Deleting a registration is not a switch for one project.
  - id: d
    text: Restart the `harbor-core` pod.
    explanation: Not correct. A restart does not change which scanner a project uses.
  correct_option: b
  explanation: Correct. The project scanner setting overrides the default for that
    project only.
- id: ats102-010-m02-q03
  type: single_choice
  difficulty: intermediate
  learning_objective: Change Trivy adapter settings
  source_readings:
  - sections/section-010/module-02/course-02-configuring-the-trivy-adapter.md
  prompt: How do you make the built-in Trivy adapter ignore vulnerabilities that have
    no fixed version?
  options:
  - id: a
    text: Add a CVE allowlist entry for every unfixed finding.
    explanation: Not correct. An allowlist is a per-CVE decision for pulls, not a
      report setting for the scanner.
  - id: b
    text: Turn on scan on push for the project.
    explanation: Not correct. Scan on push controls when scans start, not what they
      report.
  - id: c
    text: Set `SCANNER_TRIVY_IGNORE_UNFIXED=true` on the `harbor-trivy` StatefulSet.
    explanation: Correct. The adapter reads its behaviour from `SCANNER_TRIVY_*` variables.
  - id: d
    text: Lower the severity filter in the project settings.
    explanation: Not correct. The project severity setting controls pull prevention,
      not the report content.
  correct_option: c
  explanation: Correct. The adapter reads its behaviour from `SCANNER_TRIVY_*` variables.
- id: ats102-010-m02-q04
  type: single_choice
  difficulty: intermediate
  learning_objective: Know when a settings change takes effect
  source_readings:
  - sections/section-010/module-02/course-02-configuring-the-trivy-adapter.md
  prompt: You changed an adapter variable with `kubectl set env`. Why does an existing
    report not change?
  options:
  - id: a
    text: Harbor caches the adapter settings for 24 hours.
    explanation: Not correct. There is no such cache of adapter settings.
  - id: b
    text: The variable only applies to new projects.
    explanation: Not correct. The adapter applies the variable to every scan after
      the pod restarts.
  - id: c
    text: The variable is only read when Harbor itself restarts.
    explanation: Not correct. Only the adapter pod is replaced by the change.
  - id: d
    text: The report is stored from the old scan, so you must scan again.
    explanation: Correct. Reports are stored results. A new scan with the new setting
      writes a new report.
  correct_option: d
  explanation: Correct. Reports are stored results. A new scan with the new setting
    writes a new report.
- id: ats102-010-m02-q05
  type: single_choice
  difficulty: beginner
  learning_objective: Name the severity levels
  source_readings:
  - sections/section-010/module-02/course-03-severity-cvss-and-fixed-versions.md
  prompt: Which list shows the severity levels of Harbor from the highest to the lowest?
  options:
  - id: a
    text: Critical, High, Medium, Low
    explanation: Correct. Harbor shows Critical, High, Medium and Low, and also None
      and Unknown.
  - id: b
    text: High, Critical, Low, Medium
    explanation: Not correct. Critical is above High.
  - id: c
    text: Severe, High, Normal, Low
    explanation: Not correct. Harbor does not use the word Severe or Normal.
  - id: d
    text: Critical, Major, Minor, Low
    explanation: Not correct. Harbor does not use Major or Minor.
  correct_option: a
  explanation: Correct. Harbor shows Critical, High, Medium and Low, and also None
    and Unknown.
- id: ats102-010-m02-q06
  type: single_choice
  difficulty: intermediate
  learning_objective: Read the CVSS fields
  source_readings:
  - sections/section-010/module-02/course-03-severity-cvss-and-fixed-versions.md
  prompt: Which field of a finding in the vulnerability report tells you which package
    version removes the flaw?
  options:
  - id: a
    text: "`version`"
    explanation: Not correct. `version` is the version that is installed now.
  - id: b
    text: "`fix_version`"
    explanation: Correct. `fix_version` names the version that contains the fix. `version`
      is the installed version.
  - id: c
    text: "`severity`"
    explanation: Not correct. `severity` is the rating of the flaw.
  - id: d
    text: "`links`"
    explanation: Not correct. `links` points to advisories.
  correct_option: b
  explanation: Correct. `fix_version` names the version that contains the fix. `version`
    is the installed version.
- id: ats102-010-m02-q07
  type: single_choice
  difficulty: intermediate
  learning_objective: Judge a CVSS score
  source_readings:
  - sections/section-010/module-02/course-03-severity-cvss-and-fixed-versions.md
  prompt: A finding has a CVSS score of 9.8. Which severity does it belong to?
  options:
  - id: a
    text: High
    explanation: Not correct. High covers 7.0 to 8.9.
  - id: b
    text: Medium
    explanation: Not correct. Medium covers 4.0 to 6.9.
  - id: c
    text: Critical
    explanation: Correct. Scores from 9.0 to 10.0 are Critical.
  - id: d
    text: Low
    explanation: Not correct. Low covers 0.1 to 3.9.
  correct_option: c
  explanation: Correct. Scores from 9.0 to 10.0 are Critical.
- id: ats102-010-m02-q08
  type: single_choice
  difficulty: beginner
  learning_objective: Name the scan states
  source_readings:
  - sections/section-010/module-02/course-04-scan-states-and-logs.md
  prompt: Which value of `scan_status` means the report is complete and can be read?
  options:
  - id: a
    text: "`Running`"
    explanation: Not correct. `Running` means the scan is still in progress.
  - id: b
    text: "`Finished`"
    explanation: Not correct. Harbor does not use `Finished` as a state.
  - id: c
    text: "`Queued`"
    explanation: Not correct. Harbor does not use `Queued`. A scan that has not started
      is `Pending`.
  - id: d
    text: "`Success`"
    explanation: Correct. `Success` is the state of a finished scan with a report.
  correct_option: d
  explanation: Correct. `Success` is the state of a finished scan with a report.
- id: ats102-010-m02-q09
  type: single_choice
  difficulty: intermediate
  learning_objective: Use the scan log
  source_readings:
  - sections/section-010/module-02/course-04-scan-states-and-logs.md
  prompt: A scan ends with the status `Error`. Where do you find the reason?
  options:
  - id: a
    text: In the scan log of that artifact.
    explanation: Correct. The scan log of the failed job holds the adapter's error
      message.
  - id: b
    text: In the vulnerability report of the artifact.
    explanation: Not correct. A failed scan has no report to read.
  - id: c
    text: In the SBOM of the artifact.
    explanation: Not correct. The SBOM is a different result.
  - id: d
    text: In the project's CVE allowlist.
    explanation: Not correct. An allowlist is not a log.
  correct_option: a
  explanation: Correct. The scan log of the failed job holds the adapter's error message.
- id: ats102-010-m02-q10
  type: single_choice
  difficulty: advanced
  learning_objective: Stop a scan
  source_readings:
  - sections/section-010/module-02/course-04-scan-states-and-logs.md
  prompt: What is the scan state after you stop a running scan with the API?
  options:
  - id: a
    text: "`Error`"
    explanation: Not correct. `Error` is for a failed scan, not a stopped one.
  - id: b
    text: "`Stopped`"
    explanation: Correct. Stopping a scan ends it with the state `Stopped`.
  - id: c
    text: "`Success`"
    explanation: Not correct. `Success` means a complete report.
  - id: d
    text: "`None`"
    explanation: Not correct. `None` is the state of an artifact that was never scanned.
  correct_option: b
  explanation: Correct. Stopping a scan ends it with the state `Stopped`.
