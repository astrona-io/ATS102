# Knowledge check for module 02 of section 020. Listed in astrona.yaml as a `type: quiz` entry after the module summary.
schema_version: 1
kind: question_bank
id: ats102-020-m02
course_id: ATS102
exam_code: HARBOR
status: alpha
provenance: Original practice material written for this course; not official exam
