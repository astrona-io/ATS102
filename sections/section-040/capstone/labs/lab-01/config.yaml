# Tighten A Project That Lets Everything Through
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-102-capstone-040"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-harbor"
      description: "Installs Helm, Harbor 2.15.4 and the workstation pod"
      type: "file"
      source: "bootstrap/01-install-harbor.sh"
    - name: "ats-102-capstone-040-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"

testing:
  init:
    - name: "wait-for-harbor"
      description: "Waits until every Harbor component reports healthy"
      type: "file"
      source: "testing/wait-for-harbor.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-policy"
      description: "inventory refuses High and Critical and uses its own empty allowlist"
      type: "file"
      source: "validation/validate-policy.sh"
    - name: "validate-system-allowlist-expires"
      description: "The system allowlist keeps its entries and expires within 7 days"
      type: "file"
      source: "validation/validate-system-allowlist-expires.sh"
    - name: "validate-pulls"
      description: "inventory refuses podinfo 6.0.0 and treats 6.15.0 by its report"
      type: "file"
      source: "validation/validate-pulls.sh"

teardown:
  keepCluster: false
