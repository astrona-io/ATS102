# Block High Risk, Allow A Reviewed Exception
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-102-lab-040-01"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-harbor"
      description: "Installs Helm, Harbor 2.15.4 and the workstation pod"
      type: "file"
      source: "bootstrap/01-install-harbor.sh"
    - name: "ats-102-lab-040-01-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"

testing:
  init:
    - name: "wait-for-harbor"
      description: "Waits until every Harbor component reports healthy"
      type: "file"
      source: "testing/wait-for-harbor.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-policies"
      description: "inventory and legacy refuse artifacts with High or Critical vulnerabilities"
      type: "file"
      source: "validation/validate-policies.sh"
    - name: "validate-inventory-refuses"
      description: "inventory refuses podinfo 6.0.0 and treats 6.15.0 by its report"
      type: "file"
      source: "validation/validate-inventory-refuses.sh"
    - name: "validate-legacy-exception"
      description: "legacy allows podinfo 6.0.0 through a narrow, expiring project allowlist"
      type: "file"
      source: "validation/validate-legacy-exception.sh"
    - name: "validate-system-allowlist-empty"
      description: "The system CVE allowlist is still empty"
      type: "file"
      source: "validation/validate-system-allowlist-empty.sh"

teardown:
  keepCluster: false
